description: >-
  ACCESS-OM2 0.25 degree interannual forcing simulation with mixed 
  layer tracer budget diagnostics
  
  This simulation is a rerun of the 1988-2018 portion of the 
  ACCESS-OM2 0.25 degree simulation that was submitted to the Coupled 
  Model Intercomparison Program (CMIP6)'s Ocean Model Intercomparison 
  Program Version 2 (OMIP-2) under atmospheric forcing from the 
  Japanese 55-year Reanalysis - ocean forcing (JRA55-do) version 1.4. 
  It is initialized from restart334 (1988-01-01) of the 
  025deg_jra55_iaf_omip2_cycle6 simulation.

  The simulation has been extended to 2023 using JRA55-do version 
  1.5.0 (2019) and 1.5.0.1 (2020-2023). 
  
  The key innovation and raison d'etre for this simulation is the 
  implementation of online mixed layer tracer budget diagnostics for 
  diagnosing the drivers of mixed layer temperature (particularly 
  relevant for the analysis of Marine Heatwaves) and salinity 
  variability.

  Github repository containing the configuration used for this 
  simulation:
  - https://github.com/rmholmes/025deg_jra55_iaf/tree/online_mlt_cycle6_rerunOct25

  Github repository containing the MOM5 code used for this simulation 
  (with new online mixed layer budget diagnostics):
  - https://github.com/rmholmes/MOM5/tree/ml_budget_hat_average

  Description of original OMIP-2 simulation 
  (025deg_jra55_iaf_omip2_cycle6):
  ACCESS-OM2-025 physics-only contribution to the CMIP6 Ocean
  Model Intercomparison Program project phase 2 (OMIP-2), as discussed
  by Tsujino et al. (2020, GMD,
  https://doi.org/10.5194/gmd-2019-363). The configuration is based on
  that described in Kiss et al. (2020),
  https://doi.org/10.5194/gmd-13-401-2020, but with many improvements.
  Initial conditions are WOA13v2 potential temperature and practical
  salinity. However, the WOA potential temperature field is converted
  to Conservative Temperature for the initical condition unlike
  earlier versions of ACCESS-OM2. The topography has also been updated
  (see https://github.com/COSIMA/access-om2/issues/158). Run with
  JRA55-do v1.4.0 interannually-varying forcing with all solid runoff
  converted to liquid runoff with no heat transfer. The OMIP-2
  protocol consists of six consecutive cycles of the 61-year period
  starting on 1 Jan 1958 and finishing on 1 Jan 2019. To avoid issues
  with leap years and calendars, each cycle is run as a separate
  "ensemble" experiment - and thus each has the same time/calendar
  vector.

  Additional information associated with this rerun specific to 
  the mixed layer budget diagnostics:
  This simulation contains a different set of diagnostics to the 
  original OMIP-2 simulation. Standard diagnostics
  are significantly reduced, while additional diagnostics are 
  included to allow accurate, online diagnosis of the mixed layer
  temperature and salinity budgets. More information on these
  diagnostics can be found at the following locations:
  - Github repository: 
    https://github.com/rmholmes/access-om2-sst-budget - this is 
    currently private but will be shared publically once 
    the below research paper is submitted. This will likely 
    be done through the COSIMA recipes repository 
    https://github.com/COSIMA/cosima-recipes. The repository 
    contains an overview of the theory, all the code required to 
    do post-processing and a tutorial on how to analyse a marine
    heat wave event using the diagnostics.
  - Research paper: Holmes, Malan and Bladwell, Accurately 
    diagnosing mixed layer tracer budgets in a global ocean model, 
    in preparation.

  Note that in this data store there is also a series of post-
  processed diagnostics, stored in the post_processed_diags/ 
  subfolder. These include 1989-2018 (outputs 336-365) climatologies 
  of standard monthly averaged diagnostics 
  (ocean_month_output336-365.clim.nc) and snapshot diagnostics 
  (ocean_snapshot_month_output336-365.clim.nc), as well as 
  post-processed grouped mixed layer temperature and salinity budget
  terms. The later are included so that users do not have to deal 
  themselves with the full (10+ term) budget themselves, or compute
  tendency or entrainment terms themselves. Instead, they can just 
  work with a simpler version of the budget that includes fewer terms.
  There are several versions of these budgets:
  - mlt_budget_online_stavg/mlt_budget_stavg_daily_online_output***.nc - 
    daily resolution online standard time averages of the mixed layer 
    temperature budget for each year/output.
  - mlt_budget_online_stavg/mlt_budget_stavg_daily_online_output***_monthly_mean.nc 
    monthly mean of the previous.
  - mlt_budget_online_stavg/mlt_budget_stavg_daily_online_output336-365_monthly_mean.ncea.nc
    1989-2018 climatological of the previous.
  - mlt_budget_offline/mlt_budget_stavg_daily_offline_output366_monthly_mean.nc 
    daily resolution mixed layer temperature budget for 2019 computed using
    daily *offline* binning of 3D heat budget diagnostics into the 
    daily-averaged mixed layer. This is only included for evaluating 
    the errors made using offline techniques - most users should not 
    use this data.
  - mlt_budget_offline/mlt_budget_stavg_monthly_offline_*** - as previous 
    except using monthly *offline* binning of 3D heat budget diagnostics 
    into the monthly-averaged mixed layer. This is only included for 
    evaluating the errors made using offline techniques - most users 
    should not use this data.
  - mlt_budget_online_falavg/mlt_budget_falavg_daily_online_output***.nc - 
    Falling-average online diagnostics - these are used, along with 
    the standard average diagnostics, to construct hat-averages of 
    the budget for computing the budget of *time-averaged* mixing 
    layer temperature, rather than snapshots (see resources above for
    more discussion).
  - mls_budget/mls_budget_stavg_daily_online_*** - as for 
    mlt_budget_stavg_daily_online except for the mixed layer salinity
    budget. Note that, as of February 2026, the salinity budget diagnostics 
    have only gone through minimal testing.
  Note that not all years of the daily online post processed budgets
  have been saved on disk but they can be regenerated easily.
  Also included are marine heat wave mean and 90th percentile (threshold) 
  climatologies calculated following Hobday et al. (2016) using a fixed 
  baseline 1989-2018 (om2_025_MLT_clim.nc and om2_025_MLT_thresh.nc).

